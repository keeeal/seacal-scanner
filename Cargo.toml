[package]
name = "goldeneye"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "main"
path = "src/app/main.rs"

[dependencies]
chrono = "0.4.44"
directories = "5.0.1"
eframe = "0.30.0"
egui-file-dialog = "0.8.0"
egui_extras = { version = "0.30.0", features = ["default", "image"] }
image = { version = "0.25.5", features = ["png"] }
nokhwa = { version = "0.10.10", features = ["input-native", "output-wgpu"] }
rmp-serde = "1.3.0"
rmpv = { version = "1.3.0", features = ["with-serde"] }
serde = "1.0.217"
serialport = "4.6.1"
